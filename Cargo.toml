[workspace]
resolver = "2"
members = ["."]  # 当前包作为workspace成员

[workspace.package]
version = "0.15.7" # @gxl:set(version)
edition = "2024"
description = "Stable connectors for warp-parse supporting source and sink functionality"
authors = ["WP Labs Team"]
license = "Apache-2.0"
repository = "https://github.com/wp-labs/wp-connectors"
homepage = "https://github.com/wp-labs/wp-connectors"

[workspace.dependencies]
# WP Core Dependencies
wp-connector-api = "0.10"
wp-parse-api =  "0.10"
wp-model-core = "0.8.9"
wp-log =  "0.4"
wp-error =  "0.10"
wp-specs =  "0.10"
wp-conf-base = "0.4"
wp-data-fmt = "0.2"

orion_exp = "0.1"
orion-error = "0.8"
orion_conf = { version = "0.7", features = ["yaml", "toml"] }

async-trait = "0.1"
anyhow = "1.0"
chrono = "0.4"
log = "0.4"
rdkafka-wrap = { version = "0.1"  }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
tokio = { version = "1.48", features = ["full"] }
bytes = "1.11.0"
winnow = "1.0"
educe = { version = "0.7", default-features = false, features = ["Debug", "Default"] }
sea-orm = { version = "1.1", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "runtime-tokio-rustls"] }
sqlx = { version = "0.9", default-features = false, features = ["mysql", "runtime-tokio", "tls-native-tls"]  }
arrow = "59"
wf-connector-api = "0.2"

# Optional Feature Dependencies
actix-web = { version = "4.12", default-features = false, features = ["macros"] }
reqwest = { version = "0.13", features = ["json"] }
clickhouse = "0.15.0"
prometheus = "0.14"
regex = "1.12"
lazy_static = "1.5"
uuid = { version = "1.19", features = ["v4"] }
rand = "0.10"
flate2 = "1.0"
base64 = "0.22"

# Dev Dependencies
env_logger = "0.11"

[package]
name = "wp-connectors"
edition = "2024"
version.workspace = true
description = "Stable connectors for warp-parse: http, doris, elasticsearch, kafka, mysql, postgres, clickhouse, prometheus, victoriametrics, victorialogs, count"
authors = ["WP Labs Team"]
license = "Apache-2.0"
repository = "https://github.com/wp-labs/wp-connectors"
homepage = "https://github.com/wp-labs/wp-connectors"

[features]
default = ["kafka", "mysql", "postgres", "prometheus", "victoriametrics", "victorialogs", "doris", "count", "clickhouse", "elasticsearch", "http"]
kafka = [ "dep:rdkafka-wrap"]
mysql = []
postgres = []
# dmdb = ["odbc-api"]
count = []
victorialogs = []
external_integration = []
external_performance = []
full = ["kafka", "mysql", "postgres", "prometheus", "clickhouse", "elasticsearch", "victoriametrics", "victorialogs", "doris", "http"]
prometheus = [
    "dep:actix-web",
    "dep:prometheus",
    "dep:regex",
    "dep:lazy_static",
    "dep:uuid",
    "dep:sysinfo"
]
victoriametrics = [
    "dep:reqwest",
    "dep:prometheus",
    "dep:regex",
    "dep:lazy_static",
    "dep:uuid",
    "dep:sysinfo",
]
doris = ["dep:reqwest"]
elasticsearch = ["dep:reqwest"]
clickhouse = ["dep:reqwest", "dep:clickhouse"]
http = ["dep:reqwest", "dep:flate2", "dep:base64", "dep:actix-web"]

[dependencies]
wp-connector-api = { workspace = true }
wp-parse-api = { workspace = true }
wp-model-core = { workspace = true }
wp-log = { workspace = true }
wp-error = { workspace = true }
wp-specs = { workspace = true }
wp-conf-base = { workspace = true }
wp-data-fmt = { workspace = true }
orion_exp = { workspace = true }
orion-error = { workspace = true }
orion_conf = { workspace = true }

async-trait = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
log = { workspace = true }
rdkafka-wrap = { workspace = true, optional = true  }
arrow = { workspace = true }
wf-connector-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
winnow = { workspace = true }
educe = { workspace = true }
derive_more = "2"
sea-orm = { workspace = true }
sqlx = { workspace = true }

actix-web = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
clickhouse = { workspace = true, optional = true }
prometheus = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
sysinfo = { version = "0.39", default-features = false, features = ["system"], optional = true }

[dev-dependencies]
wp-connector-test-utils = { git = "https://github.com/wp-labs/wp-connector-test-utils.git", tag = "v0.2.2"}
# wp-connector-test-utils = { path = "../wp-connector-test-utils" }
anyhow = { workspace = true }
env_logger = { workspace = true }
httpmock = "0.8"
quickcheck = "1.0"
quickcheck_macros = "1.0"
rand = { workspace = true }
sqlx = { workspace = true }
async-broadcast = "0.7"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }

[[example]]
name = "http_sink_example"
path = "examples/http/http_sink_example.rs"
required-features = ["http"]

[[example]]
name = "http_sink_concurrent_test"
path = "examples/http/http_sink_concurrent_test.rs"
required-features = ["http"]
